description: >-
  The company ran on an ageing central CMS that handled almost everything the
  business did, from campaign setup and compliance to the financial reports
  behind its accounts and targets. It was business-critical but old, and some
  data was still entered manually.


  I joined the central team that owned the CMS and contributed to it, from
  features and optimisation to landing pages. My biggest contribution was
  bringing Facebook ad-spend data into the CMS automatically. A separate
  application already aggregated this data, but it wasn't available in the
  central CMS, so I built the integration that fed it straight into the system's
  cost and revenue calculations, letting internal users see how each campaign
  was performing.


  Reports that had relied on manual entry now updated automatically, moving the
  business much closer to real-time reporting. It could pull current campaign
  economics whenever needed, covering millions in ad spend and revenue each
  month.
da:
  description: >-
    Virksomheden kørte på et ældre centralt CMS, der håndterede næsten alt i
    forretningen, fra kampagneopsætning og compliance til den økonomiske
    rapportering bag regnskab og budgetter. Det var forretningskritisk, men
    gammelt, og en del data blev stadig tastet ind i hånden.


    Jeg kom med i det centrale team, der havde ansvaret for CMS'et, og
    bidrog med alt fra nye features og optimering til landingssider. Mit
    største bidrag var at få data om Facebook-annonceforbrug automatisk ind
    i systemet. En anden applikation samlede allerede dataene, men de nåede
    aldrig frem til CMS'et, så jeg byggede en integration, der førte dem
    direkte ind i beregningerne af omkostninger og omsætning. Så kunne
    interne brugere se, hvordan hver kampagne klarede sig.


    Rapporter, der før krævede manuel indtastning, blev nu opdateret
    automatisk. Forretningen kom langt tættere på realtidsrapportering og
    kunne til enhver tid trække de aktuelle kampagnetal for millioner i
    annonceforbrug og omsætning om måneden.
