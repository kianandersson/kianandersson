role: Tech Lead
meta: Danish Broadcasting Corporation
start: 2021-05-01
end: 2022-05-31
description: >-
  The publishing platform behind dr.dk was spread across too many applications
  on costly, ageing hosting. The CMS and API teams were brought together to
  modernise it, and as tech lead of the merged team, I led the transformation.


  I forged two teams into one, with shared culture, a shared codebase, and
  cross-system competence. Working with the enterprise architects, I set the
  technical direction and designed a content aggregation service, a
  system-agnostic, event-driven API that unified dr.dk's content behind a
  single contract, and took it into production. In parallel I modernised the
  team's foundation, leading its retraining on .NET, migrating it onto a new
  in-house Kubernetes platform, and consolidating the application portfolio
  into a lean core. I also represented the team in DR's architecture forums,
  aligning cross-cutting efforts across teams.


  The result was a leaner, more cloud-mature platform, with fewer applications
  to run and modern infrastructure replacing costly hosting.
da:
  meta: DR
  description: >-
    Publiceringsplatformen bag dr.dk var spredt over for mange applikationer
    på dyr og forældet hosting. CMS- og API-teamene blev lagt sammen for at
    modernisere den, og som tech lead for det samlede team stod jeg i spidsen
    for transformationen.


    Jeg fik de to teams til at fungere som ét team med fælles kultur, fælles
    kodebase og kompetencer på tværs af systemerne. Sammen med
    enterprise-arkitekterne satte jeg den tekniske retning og designede og
    idriftsatte en systemagnostisk, eventdrevet content aggregation service,
    der samlede dr.dk's indhold bag én kontrakt. Samtidig moderniserede jeg
    teamets tekniske grundlag. Jeg ledede omskolingen til .NET, flyttede
    driften til en ny intern Kubernetes-platform og konsoliderede
    applikationsporteføljen til en slank kerne. Jeg repræsenterede også teamet
    i DR's arkitekturfora og koordinerede tværgående indsatser.


    Resultatet blev en slankere og mere cloud-moden platform med færre
    applikationer at drive og moderne infrastruktur i stedet for dyr hosting.
