role: Tech Lead
meta: Danish Broadcasting Corporation
start: 2021-05-01
end: 2022-05-31
description: >-
  The publishing platform behind dr.dk was spread across more than 20
  applications on costly, ageing hosting platforms. The CMS and API teams were
  merged to modernise it, and as tech lead of the merged team, I led the
  transformation.


  I mapped the full system and hosting landscape and planned the transition
  from the existing to the new solution, consolidating the portfolio into
  fewer than five applications on a new in-house Kubernetes platform. In
  parallel I led the team's retraining on .NET and forged two teams into one.


  Working with architects across the organisation, I designed and took into
  production an event-driven content aggregation service that unified dr.dk's
  content behind a single integration contract for frontends and other
  backend systems alike. I developed a shared information model together with
  frontend and backend architects and built reprocessing in from the start
  with idempotency, dead-letter queues, and replay. In the organisation's
  architecture forums I advised fellow architects on cross-cutting
  architecture decisions.


  The result was a leaner, cloud-native platform with far fewer applications
  to run, modern infrastructure replacing costly hosting, and one contract
  between dr.dk's content and the products that use it.
da:
  meta: DR
  description: >-
    Publiceringsplatformen bag dr.dk var spredt over mere end 20 applikationer
    på dyre og forældede hostingplatforme. CMS- og API-teamene blev lagt
    sammen for at modernisere den, og som tech lead for det samlede team stod
    jeg i spidsen for transformationen.


    Jeg kortlagde det samlede system- og hostinglandskab og planlagde
    overgangen fra eksisterende til ny løsning, hvor porteføljen blev
    konsolideret til under fem applikationer på en ny intern
    Kubernetes-platform. Samtidig ledede jeg teamets omskoling til .NET og
    samlede de to teams til ét.


    Sammen med arkitekter på tværs af organisationen designede og
    idriftsatte jeg en eventdrevet content aggregation service, der samlede
    dr.dk's indhold bag én integrationskontrakt for både frontends og andre
    backend-systemer. Jeg udviklede en fælles informationsmodel sammen med
    frontend- og backend-arkitekter og byggede genbehandling ind fra start med
    idempotens, dead letter-køer og replay. I organisationens arkitekturfora
    gav jeg sparring til andre arkitekter på tværgående arkitekturbeslutninger.


    Resultatet blev en slankere, cloud-native platform med langt færre
    applikationer at drive, moderne infrastruktur i stedet for dyr hosting og
    én kontrakt mellem dr.dk's indhold og de produkter, der bruger det.
