role: Lead Software Engineer
meta: Social Release
start: 2017-02-01
end: 2017-06-30
description: >-
  An early-stage music startup wanted a paywalled platform that brought fans
  closer to musicians, with livestreamed concerts, unreleased tracks and
  personal content. Nothing existed yet, and it had to reach paying customers
  fast.


  As the sole engineer, I owned the technical design and built the product. I
  modelled the domain of artists, fans and paid content, and built the access
  control behind the paywall. I integrated a hosted payment platform for billing
  and a third-party service for the livestreams, so that concert streams and
  exclusive content reached only paying users. To reach revenue fast, I tailored
  each artist's space instead of building a generic platform.


  The platform went live with paying users and delivered livestreamed concerts
  for its first artists, taking it from nothing to revenue within months.
da:
  description: >-
    En musikstartup i en tidlig fase ville bringe fans tættere på musikerne
    med en platform bag betalingsmur, hvor de fik adgang til livestreamede
    koncerter, uudgivne numre og personligt indhold. Intet var bygget endnu,
    og platformen skulle hurtigt ud til betalende kunder.


    Som eneste udvikler stod jeg for det tekniske design og byggede
    produktet. Jeg modellerede domænet omkring kunstnere, fans og betalt
    indhold og byggede adgangskontrollen bag betalingsmuren. Jeg integrerede
    en hostet betalingsplatform og en tredjepartstjeneste til livestreams,
    så koncerter og eksklusivt indhold kun var tilgængeligt for betalende
    brugere. For hurtigt at skabe omsætning skræddersyede jeg hver kunstners
    univers frem for at bygge en generisk platform.


    Platformen gik i luften med betalende brugere og livestreamede koncerter
    med de første kunstnere. På få måneder var virksomheden gået fra nul til
    omsætning.
