role: Senior Software Engineer
meta: Danish Broadcasting Corporation
start: 2017-07-01
end: 2021-04-30
description: >-
  An ageing Drupal monolith ran the editorial workflow and rendered the
  frontend of dr.dk, one of Denmark's largest news sites, leaving it slow and
  hard to evolve. The answer was a decoupled,
  headless architecture, with a frontend that could evolve independently of
  whatever sat behind it, backed by a content service feeding it structured
  content.


  I owned the architecture of the content service at the application level and
  built its core. I designed its event-driven pipeline, the REST API, and the
  caching strategy behind it, and I wrote the indexing engine and the parser
  that turned Drupal's raw HTML into a component-oriented model the frontend
  could consume directly.


  It made dr.dk faster and more resilient, serving nearly a million articles
  from a hard CDN cache that kept it available even if the systems behind
  it went down. The decoupling proved durable, and the underlying CMS was
  later replaced without rebuilding the frontend.
da:
  meta: DR
  description: >-
    En ældre Drupal-monolit styrede det redaktionelle workflow og renderede
    frontenden på dr.dk, et af Danmarks største nyhedssites, og gjorde sitet
    langsomt og svært at videreudvikle. Løsningen var en afkoblet
    headless-arkitektur med en frontend, der kunne udvikles uafhængigt af
    systemerne bagved, og en content service, der forsynede den med
    struktureret indhold.


    Jeg havde ansvaret for content servicens arkitektur på
    applikationsniveau og byggede dens kerne. Jeg designede den eventdrevne
    pipeline, REST-API'et og cachingstrategien, og jeg skrev
    indekseringsmotoren og den parser, der omsatte Drupals rå HTML til en
    komponentorienteret model, som frontenden kunne bruge direkte.


    Det gjorde dr.dk hurtigere og mere robust. Næsten én million artikler
    blev serveret fra en hård CDN-cache, der holdt sitet oppe, selv hvis
    systemerne bagved gik ned. Afkoblingen viste sig holdbar, og det
    underliggende CMS blev senere udskiftet, uden at frontenden skulle
    bygges om.
