description: >-
  Clients wanted a website that felt genuinely their own, with a bespoke,
  distinctive design that set them apart from a templated site. It also
  had to work in several languages and be easy for the owner to maintain.


  Working solo on each project, I designed a custom visual look for
  each site and built the frontend by hand to match. Behind it I built a
  CMS so clients could manage their content easily, written in raw PHP on
  a custom MVC and routing layer with the content modelled in SQL.


  Every site went live in production, each with a design of its own and
  built to be responsive, multilingual and search-optimised.
da:
  description: >-
    Kunderne ville have en hjemmeside, der føltes som deres egen, med et
    skræddersyet design med særpræg frem for en standardskabelon. Den skulle
    også fungere på flere sprog og være let for ejeren selv at vedligeholde.


    Jeg arbejdede alene på hvert projekt, designede et skræddersyet visuelt
    udtryk til hver side og udviklede frontenden fra bunden ud fra det. Bag
    den byggede jeg et CMS, så kunderne selv kunne redigere deres indhold.
    Det var skrevet i ren PHP på et egenudviklet MVC- og routinglag med
    indholdet modelleret i SQL.


    Alle siderne gik i luften med hvert sit design og var responsive,
    flersprogede og søgemaskineoptimerede.
