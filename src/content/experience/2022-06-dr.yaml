role: Tech Lead
meta: Danish Broadcasting Corporation
start: 2022-06-01
end: 2026-05-31
description: >-
  When login became a strategic cornerstone, the SaaS identity provider that
  more than 15 systems depended on couldn't scale affordably or meet the
  performance, UX, and protocol requirements.


  I weighed the alternatives, from switching vendor to building in-house, on
  cost and risk and wrote the decision paper for management and the steering
  committee, who followed my recommendation to build. I then built the
  platform and the six-person team behind it from scratch, designed the
  architecture, and implemented the foundation as an OpenID Connect server
  with an accessible interface.


  As architect across the login area, I set the direction for how other teams
  integrated, established a shared information model, clarified data
  ownership in light of GDPR, and defined the integration contracts, including
  an event-based deletion protocol across every product. I set the
  non-functional requirements as SLAs and SLOs, backed by monitoring,
  runbooks, and disaster recovery able to rebuild the entire platform, drove
  the test strategy, and recorded key decisions as ADRs. I owned the security
  risk assessment and DPIA, led the hardening against real attacks, and stayed
  hands-on for the hardest issues.


  The platform scaled to millions of users, with peaks of 500,000 users
  authenticating within minutes, and replaced a SaaS contract worth millions a
  year at a fraction of the cost. Every user was migrated off the vendor and
  reconciled against the old solution.
da:
  meta: DR
  description: >-
    Da login blev en strategisk hjørnesten, kunne SaaS-identitetsudbyderen,
    som mere end 15 systemer afhang af, hverken skalere til en fornuftig pris
    eller leve op til kravene til performance, UX og protokoller.


    Jeg vurderede alternativerne, fra leverandørskifte til egenudvikling, ud
    fra økonomi og risiko og skrev beslutningsoplægget til ledelse og
    styregruppe, som fulgte min anbefaling om at bygge selv. Derefter byggede
    jeg platformen og det seksmandsstærke team bag den op fra bunden,
    designede arkitekturen og implementerede fundamentet som en OpenID
    Connect-server med en tilgængelig brugerflade.


    Som arkitekt på tværs af login-området satte jeg retningen for, hvordan
    andre teams integrerede, etablerede en fælles informationsmodel, afklarede
    dataejerskab i lyset af GDPR og definerede integrationskontrakterne,
    herunder en eventbaseret sletteprotokol på tværs af alle produkter. Jeg
    fastlagde de ikke-funktionelle krav som SLA'er og SLO'er understøttet af
    overvågning, runbooks og disaster recovery, der kan genetablere hele
    platformen, drev teststrategien og dokumenterede centrale beslutninger i
    ADR'er. Jeg stod for sikkerhedsrisikovurdering og DPIA, ledede hærdningen
    mod reelle angreb og forblev hands-on på de sværeste opgaver.


    Platformen skalerede til millioner af brugere med spidsbelastninger på
    500.000 logins på få minutter og erstattede en SaaS-kontrakt til millioner
    om året for en brøkdel af prisen. Alle brugere blev migreret fra
    leverandøren og afstemt mod den gamle løsning.
