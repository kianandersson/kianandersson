role: Tech Lead
meta: Danish Broadcasting Corporation
start: 2022-06-01
end: 2026-05-31
description: >-
  When login became a strategic cornerstone, the SaaS identity provider
  couldn't scale affordably or meet the performance, UX, and protocol
  requirements. I analysed the requirements, built the business case and
  roadmap for an in-house platform, and led the transformation.


  I built the platform and the six-person team behind it from scratch. I set
  the technical direction, designed the architecture, and implemented the
  foundation as an OpenID Connect server with an accessible interface. I owned
  the security risk assessment and DPIA and led the hardening against real
  attacks. As the platform matured, my focus shifted toward mentoring and
  reviewing as the team took ownership, though I stayed hands-on for the
  hardest and most time-critical issues.


  The platform scaled to millions of users, with up to 500,000 logins during
  major live events, and replaced a SaaS contract worth millions a year at a
  fraction of the infrastructure cost. Every user was migrated off the vendor
  with zero downtime.
da:
  meta: DR
  description: >-
    Da login blev en strategisk hjørnesten, kunne SaaS-identitetsudbyderen
    hverken skalere til en fornuftig pris eller leve op til kravene til
    performance, UX og protokoller. Jeg analyserede kravene, lavede business
    case og roadmap for en egenudviklet platform og stod i spidsen for
    transformationen.


    Jeg byggede platformen og det seksmandsstærke team op fra bunden. Jeg
    satte den tekniske retning, designede arkitekturen og byggede fundamentet
    som en OpenID Connect-server med en tilgængelig brugerflade. Jeg stod for
    sikkerhedsrisikovurdering og DPIA og ledede hærdningen mod reelle angreb.
    Efterhånden som teamet tog ejerskab, skiftede mit fokus til mentoring og
    reviews, men jeg var fortsat hands-on på de sværeste og mest tidskritiske
    opgaver.


    Platformen skalerede til millioner af brugere med op til 500.000 logins
    under store live-events. Den erstattede en SaaS-kontrakt til millioner
    om året, og infrastrukturen kostede kun en brøkdel. Alle brugere blev
    migreret fra leverandøren uden nedetid.
