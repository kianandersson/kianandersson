name: Workers subdomain
description: Fetch the Cloudflare workers.dev subdomain for the account.

inputs:
  api-token:
    description: Cloudflare API token.
    required: true
  account-id:
    description: Cloudflare account ID.
    required: true

outputs:
  subdomain:
    description: workers.dev subdomain (e.g. `kianandersson`).
    value: ${{ steps.fetch.outputs.subdomain }}

runs:
  using: composite
  steps:
    - id: fetch
      shell: bash
      env:
        CF_TOKEN: ${{ inputs.api-token }}
        CF_ACCOUNT: ${{ inputs.account-id }}
      run: |
        response=$(curl -fsS \
          -H "Authorization: Bearer $CF_TOKEN" \
          "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain")
        subdomain=$(echo "$response" | jq -r '.result.subdomain // empty')
        if [ -z "$subdomain" ]; then
          echo "::error::Failed to fetch workers.dev subdomain"
          echo "$response"
          exit 1
        fi
        echo "subdomain=$subdomain" >> "$GITHUB_OUTPUT"
