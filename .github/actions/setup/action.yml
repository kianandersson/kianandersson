name: Setup
description: Install pnpm + Node, optionally install project dependencies. Assumes the repo has already been checked out.

inputs:
  install:
    description: Whether to run `pnpm install --frozen-lockfile`. Set to `false` for jobs that only need the runtime (e.g. deploy, which just runs wrangler).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - if: inputs.install == 'true'
      name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Generates the gitignored worker-configuration.d.ts from wrangler.jsonc,
    # which env.d.ts references for Cloudflare runtime + Env typings.
    - if: inputs.install == 'true'
      name: Generate Cloudflare worker types
      shell: bash
      run: pnpm exec wrangler types
