name: Pull request

# PR pipeline. Maximises parallelism: static checks run alongside build,
# e2e starts as soon as the artifact is ready, preview deploys as soon
# as the static checks pass (so reviewers see the change without waiting
# for e2e).
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  test:
    uses: ./.github/workflows/test.yml

  e2e:
    needs: build
    uses: ./.github/workflows/e2e.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  create-preview:
    if: github.event.pull_request.draft == false
    needs: [build, test]
    uses: ./.github/workflows/create-preview.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}
    secrets: inherit
