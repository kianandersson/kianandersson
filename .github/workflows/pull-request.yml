name: Pull request

# PR pipeline. The `site-url` job composes the preview URL up front
# and publishes it as the `URL` variable on the per-PR environment —
# same shape as production, where the variable is set manually. Build
# bakes that URL into canonical/sitemap/og:image, deploy publishes it
# on the GitHub deployment widget.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  actions: write

jobs:
  site-url:
    name: Site URL
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - id: subdomain
        uses: ./.github/actions/workers-subdomain
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - id: worker
        shell: bash
        run: echo "name=$(jq -r '.name' wrangler.jsonc)" >> "$GITHUB_OUTPUT"

      - id: url
        shell: bash
        run: |
          echo "url=https://pr-${{ github.event.pull_request.number }}-${{ steps.worker.outputs.name }}.${{ steps.subdomain.outputs.subdomain }}.workers.dev" >> "$GITHUB_OUTPUT"

      # Mirror production's pattern: the environment owns its URL as a
      # variable. Idempotent — POST creates on first run, PATCH updates
      # on subsequent runs.
      - name: Publish URL on the preview environment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.url.outputs.url }}
          ENV_NAME: preview-pr-${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh api -X POST "repos/$REPO/environments/$ENV_NAME/variables" \
              -f name=URL -f value="$URL" 2>/dev/null; then
            gh api -X PATCH "repos/$REPO/environments/$ENV_NAME/variables/URL" \
              -f name=URL -f value="$URL"
          fi

  build:
    name: Build
    needs: site-url
    uses: ./.github/workflows/build.yml
    with:
      site-url: ${{ needs.site-url.outputs.url }}

  test:
    name: Test
    uses: ./.github/workflows/test.yml

  e2e:
    name: End-to-end tests
    needs: build
    uses: ./.github/workflows/e2e.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  bundle-size:
    name: Bundle size
    needs: build
    uses: ./.github/workflows/bundle-size.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  preview:
    name: Preview
    if: github.event.pull_request.draft == false
    needs: [site-url, build, test]
    uses: ./.github/workflows/create-preview.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
      url: ${{ needs.site-url.outputs.url }}
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}
    secrets: inherit
