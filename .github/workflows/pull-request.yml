name: Pull request

# PR pipeline. The `site-url` job composes the preview URL from the
# workers.dev subdomain (fetched from the Cloudflare API) and the
# worker name in wrangler.jsonc, so build can bake it into
# canonical/sitemap/og:image and deploy can publish it on the GitHub
# deployment widget.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  site-url:
    name: Site URL
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - id: subdomain
        uses: ./.github/actions/workers-subdomain
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - id: worker
        shell: bash
        run: echo "name=$(jq -r '.name' wrangler.jsonc)" >> "$GITHUB_OUTPUT"

      - id: url
        shell: bash
        run: |
          echo "url=https://pr-${{ github.event.pull_request.number }}-${{ steps.worker.outputs.name }}.${{ steps.subdomain.outputs.subdomain }}.workers.dev" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: site-url
    uses: ./.github/workflows/build.yml
    with:
      site-url: ${{ needs.site-url.outputs.url }}

  test:
    name: Test
    uses: ./.github/workflows/test.yml

  e2e:
    name: End-to-end tests
    needs: [site-url, build]
    uses: ./.github/workflows/e2e.yml
    with:
      site-url: ${{ needs.site-url.outputs.url }}
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  bundle-size:
    name: Bundle size
    needs: build
    uses: ./.github/workflows/bundle-size.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  preview:
    name: Preview
    if: github.event.pull_request.draft == false
    needs: [site-url, build, test]
    uses: ./.github/workflows/create-preview.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
      url: ${{ needs.site-url.outputs.url }}
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}
    secrets: inherit
