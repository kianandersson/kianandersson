name: Pull request

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  url:
    name: Preview URL
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - id: worker
        shell: bash
        run: echo "name=$(jq -r '.name' wrangler.jsonc)" >> "$GITHUB_OUTPUT"

      - id: url
        uses: ./.github/actions/preview-url
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          worker-name: ${{ steps.worker.outputs.name }}
          alias: pr-${{ github.event.pull_request.number }}

  build:
    name: Build
    needs: url
    uses: ./.github/workflows/build.yml
    with:
      url: ${{ needs.url.outputs.url }}

  test:
    name: Test
    uses: ./.github/workflows/test.yml

  e2e:
    name: End-to-end tests
    needs: [url, build]
    uses: ./.github/workflows/e2e.yml
    with:
      url: ${{ needs.url.outputs.url }}
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  bundle-size:
    name: Bundle size
    needs: build
    uses: ./.github/workflows/bundle-size.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  lighthouse-local:
    name: Lighthouse (local)
    needs: build
    uses: ./.github/workflows/lighthouse-local.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  preview:
    name: Preview
    if: github.event.pull_request.draft == false
    needs: [url, build, test]
    uses: ./.github/workflows/create-preview.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
      url: ${{ needs.url.outputs.url }}
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}
    secrets: inherit
