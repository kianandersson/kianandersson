name: Pull request

# PR pipeline. Maximises parallelism: static checks run alongside build,
# e2e starts as soon as the artifact is ready, preview deploys as soon
# as the static checks pass (so reviewers see the change without waiting
# for e2e).
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      # Deterministic preview URL: `<alias>-<worker>.<workers-subdomain>.workers.dev`
      # — the worker name comes from wrangler.jsonc, the subdomain
      # from the `WORKERS_SUBDOMAIN` repo variable. Pre-computed so
      # the build can bake the canonical/sitemap/og:image into the
      # same URL Lighthouse audits afterwards.
      site-url: https://pr-${{ github.event.pull_request.number }}-kianandersson-com.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev

  test:
    name: Test
    uses: ./.github/workflows/test.yml

  e2e:
    name: End-to-end tests
    needs: build
    uses: ./.github/workflows/e2e.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  bundle-size:
    name: Bundle size
    needs: build
    uses: ./.github/workflows/bundle-size.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  preview:
    name: Preview
    if: github.event.pull_request.draft == false
    needs: [build, test]
    uses: ./.github/workflows/create-preview.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}
    secrets: inherit
