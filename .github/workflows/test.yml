name: Test

# Verifies code correctness: lint, typecheck, unit tests, and end-to-end
# tests against the build artifact passed in by the caller. Reusable.
on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the build artifact to download for e2e
        required: true
        type: string
      artifact-path:
        description: Where to extract the build artifact
        required: true
        type: string

jobs:
  test:
    name: Lint + typecheck + unit + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck (astro check)
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Download build artifact for e2e
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      - name: E2E + axe (Playwright)
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
