name: Test

# Verifies code correctness: lint, typecheck, unit tests, and end-to-end
# tests against the built `dist/` (downloaded from the build artifact).
# Reusable — callers must run build.yml first so the `dist` artifact
# exists in the same run.
on:
  workflow_call:

jobs:
  test:
    name: Lint + typecheck + unit + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck (astro check)
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Download dist for e2e
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: E2E + axe (Playwright)
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
