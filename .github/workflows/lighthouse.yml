name: Lighthouse

# Runs Lighthouse CI against a deployed URL. Used after a preview
# deploy to get realistic edge + TLS numbers. The same lighthouserc.cjs
# is used for local runs against `dist/` — it just switches target
# based on whether `PREVIEW_URL` is set.
on:
  workflow_call:
    inputs:
      url:
        description: URL to audit. Exposed to the LHCI config as `PREVIEW_URL`.
        required: true
        type: string

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Lighthouse CI
        env:
          PREVIEW_URL: ${{ inputs.url }}
        run: pnpm exec lhci autorun
