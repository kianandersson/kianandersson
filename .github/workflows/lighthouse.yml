name: Lighthouse

# Runs Lighthouse CI against a deployed URL — used after release to
# audit production with realistic edge + TLS numbers. The same
# lighthouserc.cjs handles local runs against `dist/` too; it switches
# target based on whether `URL` is set.
on:
  workflow_call:
    inputs:
      url:
        description: URL to audit. Exposed to the LHCI config as `URL`.
        required: true
        type: string

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Lighthouse CI
        env:
          URL: ${{ inputs.url }}
        run: pnpm exec lhci autorun
