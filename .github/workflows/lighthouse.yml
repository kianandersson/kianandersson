name: Lighthouse

# Runs Lighthouse CI against a deployed URL. Used after a preview deploy
# to get realistic edge + TLS numbers instead of `staticDistDir`.
on:
  workflow_call:
    inputs:
      url:
        description: URL to audit. Exposed to the LHCI config as `PREVIEW_URL`.
        required: true
        type: string
      config:
        description: Path to the LHCI config file
        required: false
        type: string
        default: ./lighthouserc.preview.cjs

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Lighthouse CI
        env:
          PREVIEW_URL: ${{ inputs.url }}
        run: pnpm exec lhci autorun --config=${{ inputs.config }}
