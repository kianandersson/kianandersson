name: Cleanup preview

on:
  pull_request:
    types: [closed]

permissions:
  deployments: write

jobs:
  delete-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Removes the `preview-pr-N` GitHub environment (and all its
      # deployments) when the PR is closed/merged. The Cloudflare Worker
      # version itself is left alone — CF auto-prunes old versions.
      - name: Delete preview environment
        uses: actions/github-script@v7
        with:
          script: |
            const envName = `preview-pr-${context.payload.pull_request.number}`;
            try {
              await github.rest.repos.deleteAnEnvironment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: envName,
              });
              core.info(`Deleted environment ${envName}`);
            } catch (e) {
              if (e.status === 404) {
                core.info(`Environment ${envName} not found — nothing to delete`);
              } else {
                throw e;
              }
            }
