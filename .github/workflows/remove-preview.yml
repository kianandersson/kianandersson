name: Remove preview

on:
  pull_request:
    types: [closed]

permissions:
  deployments: write

jobs:
  deactivate-deployments:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # GITHUB_TOKEN can't delete the environment itself — that needs
      # `administration: write`, which isn't available as a GITHUB_TOKEN
      # scope. Marking the deployments inactive is what removes the
      # active environment widget from the PR; the empty environment
      # record in repo settings is harmless. Cloudflare auto-prunes
      # old Worker versions.
      - name: Deactivate preview deployments
        uses: actions/github-script@v7
        with:
          script: |
            const envName = `preview-pr-${context.payload.pull_request.number}`;
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: envName,
                per_page: 100,
              },
            );
            for (const d of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: d.id,
                state: 'inactive',
              });
            }
            core.info(`Deactivated ${deployments.length} deployment(s) for ${envName}`);
