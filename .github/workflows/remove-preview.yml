name: Remove preview

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  delete-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Deleting an environment needs `Administration: write`, which the default
      # GITHUB_TOKEN can't be granted. ENV_CLEANUP_TOKEN is a fine-grained PAT
      # scoped to this repo with that permission. Cloudflare auto-prunes old
      # Worker versions on its own.
      - name: Delete preview environment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ENV_CLEANUP_TOKEN }}
          script: |
            const envName = `preview-pr-${context.payload.pull_request.number}`;
            try {
              await github.rest.repos.deleteAnEnvironment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: envName,
              });
              core.info(`Deleted environment ${envName}`);
            } catch (e) {
              if (e.status === 404) {
                core.info(`Environment ${envName} not found — nothing to delete`);
              } else {
                throw e;
              }
            }
