name: Remove preview

on:
  pull_request:
    types: [closed]

permissions:
  deployments: write

jobs:
  deactivate-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Every PR deploys under the shared `preview` environment, so on close we
      # just mark the deployment(s) tied to this PR's head SHA inactive — the
      # PR's deployment widget then reads as "inactive" instead of pointing at
      # a now-stale Cloudflare worker version. CF auto-prunes old versions.
      - name: Deactivate preview deployment
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: 'preview',
                sha,
                per_page: 100,
              },
            );
            for (const d of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: d.id,
                state: 'inactive',
              });
            }
            core.info(`Deactivated ${deployments.length} preview deployment(s) for ${sha}`);
