name: CI

# Pull request pipeline: run the checks, and if they pass on a
# non-draft PR, deploy a Cloudflare preview.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml

  deploy-preview:
    if: github.event.pull_request.draft == false
    needs: checks
    uses: ./.github/workflows/_deploy-preview.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
    secrets: inherit
