name: Checks

# Reusable: runs lint/typecheck/test/build/e2e and uploads the built
# `dist/` so a downstream deploy job can pick it up via download-artifact
# in the same workflow run. Not triggered directly.
on:
  workflow_call:

jobs:
  checks:
    name: Lint + typecheck + test + build + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck (astro check)
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

      # Required before build: the og-image integration screenshots the /og
      # page with Playwright during astro:build:done.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (astro build)
        run: pnpm build

      - name: Check JS bundle size (< 10 KB gzipped)
        run: pnpm check:bundle

      - name: E2E + axe (Playwright)
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload dist for deploy jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
