name: Deploy

# Single deploy workflow, parameterised by GitHub environment. The
# caller decides which wrangler command to run, so this workflow only
# knows "extract this artifact, then run this wrangler command in this
# environment".
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to deploy to
        required: true
        type: string
      command:
        description: Wrangler command to run (e.g. `deploy` or `versions upload --preview-alias=…`)
        required: true
        type: string
      artifact-name:
        description: Name of the build artifact to download
        required: true
        type: string
      artifact-path:
        description: Where to extract the build artifact
        required: true
        type: string
    outputs:
      url:
        description: URL of the deployed version
        value: ${{ jobs.deploy.outputs.url }}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      # Force npm to avoid pulling in pnpm just to install wrangler —
      # the action auto-detects from pnpm-lock.yaml otherwise, and this
      # job intentionally doesn't set up Node/pnpm.
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: ${{ inputs.command }}
