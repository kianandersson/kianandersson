name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to deploy to.
        required: true
        type: string
      command:
        description: Wrangler command (e.g. `deploy` or `versions upload --preview-alias=…`).
        required: true
        type: string
      url:
        description: URL to publish on the GitHub deployment widget.
        required: true
        type: string
      artifact-name:
        description: Name of the build artifact to download.
        required: true
        type: string
      artifact-path:
        description: Where to extract the build artifact.
        required: true
        type: string

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          install: false

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      # The Cloudflare adapter writes a full `wrangler.json` next to the
      # worker entry in `dist/server/` — it carries the assets binding, KV
      # namespaces, etc. that the root `wrangler.jsonc` deliberately omits.
      # The adapter also writes `.wrangler/deploy/config.json` as a pointer,
      # which `astro preview` (used by e2e) follows; wrangler itself then
      # sees two configs with mismatched base paths and bails. Strip the
      # pointer so wrangler reads `dist/server/wrangler.json` directly.
      - name: Drop adapter pointer that confuses wrangler deploy
        run: rm -rf .wrangler

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: dist/server
          command: ${{ inputs.command }}
