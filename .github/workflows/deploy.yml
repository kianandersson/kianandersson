name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to deploy to.
        required: true
        type: string
      command:
        description: Wrangler command (e.g. `deploy` or `versions upload --preview-alias=…`).
        required: true
        type: string
      url:
        description: URL to publish on the GitHub deployment widget.
        required: true
        type: string
      artifact-name:
        description: Name of the build artifact to download.
        required: true
        type: string
      artifact-path:
        description: Where to extract the build artifact.
        required: true
        type: string

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          install: false

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

      # The pointer is only used by `astro preview` in e2e; together with
      # `dist/server/wrangler.json` it makes wrangler bail with "do not
      # share the same base path", so drop it before deploy.
      - name: Drop adapter pointer that confuses wrangler deploy
        run: rm -f .wrangler/deploy/config.json

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: dist/server
          command: ${{ inputs.command }}
