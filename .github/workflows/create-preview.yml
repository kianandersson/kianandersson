name: Create preview

# No Lighthouse audit of the preview URL — Cloudflare adds
# `X-Robots-Tag: noindex` to every workers.dev response, which fails
# SEO checks. The PR's lighthouse-local job catches code-level
# regressions instead.
on:
  workflow_call:
    inputs:
      pr-number:
        description: PR number — used for the Cloudflare preview alias.
        required: true
        type: number
      url:
        description: Preview URL — published on the environment widget.
        required: true
        type: string
      artifact-name:
        required: true
        type: string
      artifact-path:
        required: true
        type: string

jobs:
  deploy-preview:
    name: Deploy preview
    # All PRs share one `preview` environment with rolling deployments — GitHub
    # auto-marks the latest as `active` and previous ones as `inactive`, and the
    # per-PR widget reads off the head SHA, so each PR still sees its own URL.
    # This means no per-PR environment records to clean up on close.
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preview
      command: versions upload --preview-alias=pr-${{ inputs.pr-number }}
      url: ${{ inputs.url }}
      artifact-name: ${{ inputs.artifact-name }}
      artifact-path: ${{ inputs.artifact-path }}
    secrets: inherit
