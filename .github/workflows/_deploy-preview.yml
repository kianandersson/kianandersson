name: Deploy preview

# Reusable: deploys the `dist` artifact produced by `_checks` to a
# Cloudflare preview version and runs Lighthouse against the live URL.
# Not triggered directly.
on:
  workflow_call:
    inputs:
      pr-number:
        description: 'Pull request number — used for the preview alias and environment name'
        required: true
        type: number

jobs:
  deploy:
    name: Deploy preview to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview-pr-${{ inputs.pr-number }}
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # `--preview-alias` produces a readable URL like
      # `pr-12-<worker>.workers.dev` instead of a random hash. Cloudflare
      # Workers does not currently support custom domains for preview URLs.
      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: versions upload --preview-alias=pr-${{ inputs.pr-number }}

      - name: Lighthouse against live preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: pnpm exec lhci autorun --config=./lighthouserc.preview.cjs
