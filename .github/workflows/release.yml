name: Release

# Production pipeline: build, test, deploy to production. Runs on push
# to `main` and on manual `workflow_dispatch` (Actions UI → Run workflow)
# for redeploying the current main on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  test:
    needs: build
    uses: ./.github/workflows/test.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  deploy:
    needs: [build, test]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      command: deploy
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}
    secrets: inherit
