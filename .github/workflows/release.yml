name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  url:
    name: Resolve URL
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - id: worker
        shell: bash
        run: echo "name=$(jq -r '.name' wrangler.jsonc)" >> "$GITHUB_OUTPUT"

      - id: url
        uses: ./.github/actions/production-url
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          worker-name: ${{ steps.worker.outputs.name }}

  build:
    name: Build
    needs: url
    uses: ./.github/workflows/build.yml
    with:
      url: ${{ needs.url.outputs.url }}

  deploy:
    name: Deploy to production
    needs: [url, build]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      command: deploy
      url: ${{ needs.url.outputs.url }}
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}
    secrets: inherit

  audit:
    name: Audit production
    needs: [url, deploy]
    uses: ./.github/workflows/lighthouse.yml
    with:
      url: ${{ needs.url.outputs.url }}
