name: Release

# Production pipeline. The site URL is resolved from the Cloudflare
# API — the worker's attached custom domain if one exists, the
# workers.dev fallback otherwise. Runs on push to `main` and on manual
# `workflow_dispatch` for redeploying the current main on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  site-url:
    name: Site URL
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - id: worker
        shell: bash
        run: echo "name=$(jq -r '.name' wrangler.jsonc)" >> "$GITHUB_OUTPUT"

      - id: url
        uses: ./.github/actions/production-url
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          worker-name: ${{ steps.worker.outputs.name }}

  build:
    name: Build
    needs: site-url
    uses: ./.github/workflows/build.yml
    with:
      site-url: ${{ needs.site-url.outputs.url }}

  test:
    name: Test
    uses: ./.github/workflows/test.yml

  e2e:
    name: End-to-end tests
    needs: [site-url, build]
    uses: ./.github/workflows/e2e.yml
    with:
      site-url: ${{ needs.site-url.outputs.url }}
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  bundle-size:
    name: Bundle size
    needs: build
    uses: ./.github/workflows/bundle-size.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  deploy:
    name: Deploy to production
    needs: [site-url, build, test, e2e, bundle-size]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      command: deploy
      url: ${{ needs.site-url.outputs.url }}
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}
    secrets: inherit
