name: Release

# Production pipeline: same parallel checks as PR, with production
# deploy gated on all of them. Runs on push to `main` and on manual
# `workflow_dispatch` for redeploying the current main on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      site-url: ${{ vars.PRODUCTION_URL }}

  test:
    name: Test
    uses: ./.github/workflows/test.yml

  e2e:
    name: End-to-end tests
    needs: build
    uses: ./.github/workflows/e2e.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  bundle-size:
    name: Bundle size
    needs: build
    uses: ./.github/workflows/bundle-size.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  deploy:
    name: Deploy to production
    needs: [build, test, e2e, bundle-size]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      command: deploy
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}
    secrets: inherit
