name: Release

# Production pipeline. The site URL lives on the GitHub `production`
# environment as `SITE_URL`; resolving it up front lets build bake the
# canonical/sitemap/og:image into the same URL that deploy publishes
# on the environment widget. Runs on push to `main` and on manual
# `workflow_dispatch` for redeploying the current main on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  site-url:
    name: Site URL
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    outputs:
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Verify SITE_URL is configured
        shell: bash
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then
            echo "::error::SITE_URL is not set on the production environment. Add it under Settings → Environments → production → Environment variables."
            exit 1
          fi

  build:
    name: Build
    needs: site-url
    uses: ./.github/workflows/build.yml
    with:
      site-url: ${{ needs.site-url.outputs.url }}

  test:
    name: Test
    uses: ./.github/workflows/test.yml

  e2e:
    name: End-to-end tests
    needs: build
    uses: ./.github/workflows/e2e.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  bundle-size:
    name: Bundle size
    needs: build
    uses: ./.github/workflows/bundle-size.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  deploy:
    name: Deploy to production
    needs: [site-url, build, test, e2e, bundle-size]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      command: deploy
      url: ${{ needs.site-url.outputs.url }}
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}
    secrets: inherit
