name: Release

# Production pipeline: same parallel checks as PR, with production
# deploy gated on all of them. Runs on push to `main` and on manual
# `workflow_dispatch` for redeploying the current main on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  test:
    uses: ./.github/workflows/test.yml

  e2e:
    needs: build
    uses: ./.github/workflows/e2e.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}

  deploy:
    needs: [build, test, e2e]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      command: deploy
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      artifact-path: ${{ needs.build.outputs.artifact-path }}
    secrets: inherit
